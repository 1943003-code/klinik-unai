name: Unpack Klinik Runtime

on:
  push:
    paths:
      - '.bundle/rt09.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild runtime zip
        run: |
          cat .bundle/rt00.b64 .bundle/rt01.b64 .bundle/rt02.b64 .bundle/rt03.b64 .bundle/rt04.b64 .bundle/rt05.b64 .bundle/rt06.b64 .bundle/rt07.b64 .bundle/rt08.b64 .bundle/rt09.b64 > runtime.b64
          base64 -d runtime.b64 > runtime.zip
          mkdir -p unpacked
          unzip -q runtime.zip -d unpacked
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.bundle' unpacked/ ./
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json vite.config.js src .env.example
          git commit -m "Expand Klinik UNAI V5 runtime source" || exit 0
          git push
