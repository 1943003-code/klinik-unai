name: Unpack Klinik Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-runtime.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild runtime zip
        shell: bash
        run: |
          set -euo pipefail
          : > runtime.b64
          for n in 00 01 02 03 04 05 06 07 08; do
            head -c 18000 ".bundle/rt${n}.b64" >> runtime.b64
          done
          head -c 8476 .bundle/rt09.b64 >> runtime.b64
          test "$(wc -c < runtime.b64)" -eq 170476
          base64 -d runtime.b64 > runtime.zip
          unzip -t runtime.zip
          rm -rf unpacked
          mkdir unpacked
          unzip -q runtime.zip -d unpacked
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.bundle' unpacked/ ./
          rm -rf unpacked runtime.b64 runtime.zip

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand Klinik UNAI V5 runtime source"
          git push
