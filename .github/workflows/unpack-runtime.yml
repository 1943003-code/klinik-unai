name: Unpack Klinik Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.bundle/**'
      - '.github/workflows/unpack-runtime.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild runtime zip
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/rt*.b64 | tr -cd 'A-Za-z0-9+/=' > runtime.b64
          base64 -d runtime.b64 > runtime.zip
          unzip -t runtime.zip
          rm -rf unpacked
          mkdir unpacked
          unzip -q runtime.zip -d unpacked
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.bundle' unpacked/ ./
          rm -rf unpacked runtime.b64 runtime.zip

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand Klinik UNAI V5 runtime source"
          git push
