name: Unpack Klinik Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-runtime.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild runtime zip
        shell: bash
        run: |
          set -euo pipefail
          : > runtime.b64
          for p in a b c d; do
            echo "rt00${p}: $(wc -c < .bundle/rt00${p}.b64) bytes"
            test "$(wc -c < .bundle/rt00${p}.b64)" -eq 4500
            cat ".bundle/rt00${p}.b64" >> runtime.b64
          done
          for n in 01 02 03 04 05 06 07 08; do
            echo "rt${n}: $(wc -c < .bundle/rt${n}.b64) bytes"
            test "$(wc -c < .bundle/rt${n}.b64)" -eq 18000
            cat ".bundle/rt${n}.b64" >> runtime.b64
          done
          echo "rt09: $(wc -c < .bundle/rt09.b64) bytes"
          test "$(wc -c < .bundle/rt09.b64)" -eq 8476
          cat .bundle/rt09.b64 >> runtime.b64
          echo "runtime.b64: $(wc -c < runtime.b64) bytes"
          test "$(wc -c < runtime.b64)" -eq 170476
          base64 -d runtime.b64 > runtime.zip
          echo "0a4f440e6fc4477bf5b2fd656643617bc3bac50c52cba1f91f5840d62febd110  runtime.zip" | sha256sum -c -
          unzip -t runtime.zip
          rm -rf unpacked
          mkdir unpacked
          unzip -q runtime.zip -d unpacked
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.bundle' unpacked/ ./
          rm -rf unpacked runtime.b64 runtime.zip .bundle

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand Klinik UNAI V5 runtime source"
          git push

# reconstruct first bundle segment from four verified parts
