<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klinik Pratama UNAI</title><meta name="theme-color" content="#1457d9"><style>:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--p:#1457d9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box,.card,.section{background:#fff;border:1px solid var(--line);border-radius:14px}.box{width:min(440px,100%);padding:28px;box-shadow:0 18px 60px #0001}.brand{font-size:24px;font-weight:800}.sub,.muted,.msg{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary{background:var(--p);color:#fff;border:0;padding:11px 15px;border-radius:10px;font-weight:700}.ghost{background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.err{color:#b42318}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0f2348;color:#fff;padding:18px 12px}.side .brand{font-size:18px;margin:6px 8px 18px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dbe7ff;border:0;padding:10px 12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{padding:16px}.metric b{font-size:28px;display:block;margin-top:8px}.section{padding:18px;margin-top:16px}.section h2{margin:0 0 14px;font-size:18px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff}@media(max-width:900px){.shell{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}</style><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';window.sb=createClient('https://sjaoclliylmcucydltnk.supabase.co','sb_publishable_jt7TQ6B1hhKJzn5YUh8UUA_1XPHuYsx');window.dispatchEvent(new Event('sb-ready'));</script></head><body><div id="login" class="login"><div class="box"><div class="brand">Klinik Pratama UNAI</div><div class="sub">Sistem Informasi Klinik Terintegrasi</div><label>Email</label><input id="email" type="email"><label>Kata sandi</label><input id="password" type="password"><div class="actions"><button class="primary" onclick="appLogin()">Masuk</button><button class="ghost" onclick="appSignup()">Buat akun awal</button></div><div id="loginmsg" class="msg">Gunakan akun yang terdaftar di sistem.</div></div></div><div id="app" class="shell hidden"><aside class="side"><div class="brand">Klinik UNAI v2</div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><b id="title">Dashboard</b><div id="who" class="muted"></div></div><button class="ghost" onclick="logout()">Keluar</button></div><div id="content"></div></main></div><script>const mods=[['dashboard','Dashboard'],['patients','Pendaftaran & Pasien'],['triage','Perawat / Triage'],['rme','Dokter / RME'],['lab','Laboratorium'],['pharmacy','Farmasi'],['cashier','Kasir / Billing'],['inpatient','Rawat Inap'],['reports','Laporan & EIS'],['admin','Administrator'],['integrations','Integrasi']];let profile,clinic,units=[];const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));window.addEventListener('sb-ready',init);async function init(){const{data:{session}}=await sb.auth.getSession();if(session)await enter();sb.auth.onAuthStateChange(async(_,s)=>s?await enter():showLogin())}function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}async function appLogin(){loginmsg.className='msg';if(!email.value||!password.value){loginmsg.textContent='Isi email dan kata sandi.';loginmsg.classList.add('err');return}loginmsg.textContent='Memeriksa akun...';const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginmsg.textContent=error.message;loginmsg.classList.add('err')}}async function appSignup(){loginmsg.className='msg';if(!email.value||password.value.length<8){loginmsg.textContent='Isi email dan kata sandi minimal 8 karakter.';loginmsg.classList.add('err');return}const{data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:'Administrator Utama Klinik UNAI'}}});loginmsg.textContent=error?error.message:(data.session?'Akun berhasil dibuat.':'Akun berhasil dibuat. Verifikasi email lalu tekan Masuk.');if(error)loginmsg.classList.add('err')}async function enter(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data;if(!profile){loginmsg.textContent='Akun belum diaktifkan.';await sb.auth.signOut();return}clinic=(await sb.from('clinics').select('*').eq('id',profile.clinic_id).single()).data;units=(await sb.from('service_units').select('*').eq('clinic_id',profile.clinic_id).order('name')).data||[];who.textContent=profile.full_name+' • '+roleName(profile.role);login.classList.add('hidden');app.classList.remove('hidden');nav.innerHTML=mods.map(m=>`<button id="n-${m[0]}" onclick="openModule('${m[0]}')">${m[1]}</button>`).join('');openModule('dashboard')}function roleName(r){return({super_admin:'Admin Utama',administrator:'Administrator',doctor:'Dokter',nurse:'Perawat',pharmacist:'Farmasi',lab:'Laboratorium',cashier:'Kasir',registration:'Pendaftaran',management:'Manajemen'})[r]||r}async function openModule(k){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+k)?.classList.add('active');title.textContent=mods.find(x=>x[0]==k)?.[1]||'';content.innerHTML='<div class="section">Memuat...</div>';try{await({dashboard,patients,triage,rme,lab,pharmacy,cashier,inpatient,reports,admin,integrations}[k]||dashboard)()}catch(e){content.innerHTML=`<div class="section"><b>Gagal memuat</b><div class="msg err">${E(e.message||e)}</div></div>`}}const metric=(t,v)=>`<div class="card metric"><span class="muted">${t}</span><b>${v}</b></div>`;async function dashboard(){const[v,p,rx,lo]=await Promise.all([sb.from('visits').select('id',{count:'exact',head:true}).gte('registered_at',new Date().toISOString().slice(0,10)),sb.from('patients').select('id',{count:'exact',head:true}),sb.from('prescriptions').select('id',{count:'exact',head:true}).in('status',['ordered','accepted','in_progress']),sb.from('lab_orders').select('id',{count:'exact',head:true}).in('status',['ordered','accepted','in_progress'])]);content.innerHTML=`<div class="grid">${metric('Kunjungan hari ini',v.count||0)}${metric('Total pasien',p.count||0)}${metric('Resep menunggu',rx.count||0)}${metric('Lab menunggu',lo.count||0)}</div><div class="section"><h2>Ringkasan Operasional</h2><p class="muted">Dashboard terhubung langsung ke Supabase Klinik UNAI v2.</p></div>`}async function patients(){const{data,error}=await sb.from('patients').select('*').eq('clinic_id',profile.clinic_id).order('created_at',{ascending:false}).limit(50);if(error)throw error;content.innerHTML=`<div class="section"><h2>Daftarkan Pasien</h2><div class="row"><div><label>No. Rekam Medis</label><input id="mr" placeholder="RM-000001"></div><div><label>NIK</label><input id="nik" maxlength="16"></div><div><label>Nama Lengkap</label><input id="pname"></div><div><label>Jenis Kelamin</label><select id="gender"><option value="">-</option><option value="male">Laki-laki</option><option value="female">Perempuan</option></select></div><div><label>Tanggal lahir</label><input id="dob" type="date"></div><div><label>No. HP</label><input id="phone"></div></div><div class="actions"><button class="primary" onclick="savePatient()">Simpan Pasien</button></div><div id="pmsg" class="msg"></div></div><div class="section"><h2>Pasien Terbaru</h2>${data?.length?`<table><tr><th>No. RM</th><th>Nama</th><th>NIK</th><th>HP</th><th></th></tr>${data.map(x=>`<tr><td>${E(x.medical_record_no)}</td><td>${E(x.full_name)}</td><td>${E(x.nik)}</td><td>${E(x.phone)}</td><td><button class="ghost" onclick="openVisitForm('${x.id}')">Daftarkan Kunjungan</button></td></tr>`).join('')}</table>`:'<p class="muted">Belum ada pasien.</p>'}</div><div id="visitForm" class="section hidden"></div>`}async function savePatient(){pmsg.className='msg';if(!mr.value.trim()||!pname.value.trim()){pmsg.textContent='No. RM dan Nama wajib diisi.';pmsg.classList.add('err');return}if(nik.value.trim()&&!/^\d{16}$/.test(nik.value.trim())){pmsg.textContent='NIK harus 16 digit.';pmsg.classList.add('err');return}const{data,error}=await sb.from('patients').insert({clinic_id:profile.clinic_id,medical_record_no:mr.value.trim(),nik:nik.value.trim()||null,full_name:pname.value.trim(),gender:gender.value||null,birth_date:dob.value||null,phone:phone.value.trim()||null,created_by:profile.id}).select('id').single();if(error){pmsg.textContent=error.message;pmsg.classList.add('err');return}await patients();openVisitForm(data.id)}async function openVisitForm(pid){const p=(await sb.from('patients').select('id,medical_record_no,full_name').eq('id',pid).single()).data;const doctors=(await sb.from('profiles').select('id,full_name').eq('clinic_id',profile.clinic_id).eq('role','doctor').eq('is_active',true)).data||[];const out=units.filter(u=>u.unit_type==='outpatient');visitForm.classList.remove('hidden');visitForm.innerHTML=`<h2>Daftarkan Kunjungan</h2><p><b>${E(p.full_name)}</b> • ${E(p.medical_record_no)}</p><input id="visitPatientId" type="hidden" value="${p.id}"><div class="row"><div><label>Jenis Kunjungan</label><select id="visitType"><option value="outpatient">Rawat Jalan</option><option value="emergency">Gawat Darurat</option><option value="inpatient">Rawat Inap</option></select></div><div><label>Unit Tujuan</label><select id="visitUnit">${out.map(u=>`<option value="${u.id}">${E(u.name)}</option>`).join('')}</select></div><div><label>Dokter</label><select id="visitDoctor"><option value="">Belum ditentukan</option>${doctors.map(d=>`<option value="${d.id}">${E(d.full_name)}</option>`).join('')}</select></div><div><label>Penjamin</label><select id="payerType"><option>UMUM</option><option>BPJS</option><option>ASURANSI</option></select></div><div><label>Nama Asuransi</label><input id="insurerName"></div><div><label>No. BPJS / Polis</label><input id="insuranceNo"></div></div><div class="actions"><button class="primary" onclick="saveVisit()">Simpan Kunjungan</button></div><div id="vmsg" class="msg"></div>`;visitForm.scrollIntoView({behavior:'smooth'})}const pad=(n,w=3)=>String(n).padStart(w,'0');async function saveVisit(){vmsg.className='msg';const now=new Date(),y=now.getFullYear(),m=pad(now.getMonth()+1,2),d=pad(now.getDate(),2),start=new Date(y,now.getMonth(),now.getDate()).toISOString(),end=new Date(y,now.getMonth(),now.getDate()+1).toISOString();const c=await sb.from('visits').select('id',{count:'exact',head:true}).gte('registered_at',start).lt('registered_at',end),seq=(c.count||0)+1,vt=visitType.value,vn=`KJ-${y}${m}${d}-${pad(seq,4)}`,qn=`${vt==='emergency'?'IGD':vt==='inpatient'?'RI':'A'}-${pad(seq)}`;const{error}=await sb.from('visits').insert({clinic_id:profile.clinic_id,patient_id:visitPatientId.value,visit_no:vn,visit_type:vt,service_unit_id:visitUnit.value||null,doctor_id:visitDoctor.value||null,payer_type:payerType.value,insurer_name:insurerName.value.trim()||null,insurance_no:insuranceNo.value.trim()||null,queue_no:qn,status:'registered',created_by:profile.id});if(error){vmsg.textContent=error.message;vmsg.classList.add('err');return}vmsg.textContent='Kunjungan berhasil dibuat. Pasien masuk antrean Triage.';setTimeout(()=>openModule('triage'),500)}async function triage(){const{data,error}=await sb.from('visits').select('id,visit_no,queue_no,status,patients(full_name,medical_record_no)').in('status',['registered','triage','waiting_doctor']).order('registered_at',{ascending:false}).limit(50);if(error)throw error;content.innerHTML=`<div class="section"><h2>Antrean Triage</h2>${nested(data)}</div><div class="section"><h2>Asesmen Awal</h2><p class="muted">Keluhan utama, tanda vital, skala nyeri, alergi, risiko jatuh dan tingkat triage akan dicatat per kunjungan.</p></div>`}async function rme(){const{data}=await sb.from('visits').select('visit_no,status,patients(full_name,medical_record_no)').in('status',['waiting_doctor','in_service','triage']).order('registered_at',{ascending:false}).limit(50);content.innerHTML=`<div class="section"><h2>Daftar Pasien Dokter</h2>${nested(data)}</div><div class="section"><h2>RME Terintegrasi</h2><p class="muted">SOAP, diagnosis, tindakan, CPOE, resep elektronik dan CPPT tersedia dalam fondasi database.</p></div>`}async function lab(){const{data}=await sb.from('lab_orders').select('id,status,ordered_at,visits(visit_no,patients(full_name))').order('ordered_at',{ascending:false}).limit(50);content.innerHTML=`<div class="section"><h2>Order Laboratorium</h2>${data?.length?`<table><tr><th>Waktu</th><th>Kunjungan</th><th>Pasien</th><th>Status</th></tr>${data.map(x=>`<tr><td>${new Date(x.ordered_at).toLocaleString('id-ID')}</td><td>${E(x.visits?.visit_no)}</td><td>${E(x.visits?.patients?.full_name)}</td><td><span class="badge">${E(x.status)}</span></td></tr>`).join('')}</table>`:'<p class="muted">Belum ada order.</p>'}</div>`}async function pharmacy(){const[med,rx]=await Promise.all([sb.from('medicines').select('*').order('name').limit(100),sb.from('prescriptions').select('id',{count:'exact',head:true})]);content.innerHTML=`<div class="grid">${metric('Master obat',med.data?.length||0)}${metric('Resep',rx.count||0)}${metric('Depo',3)}${metric('Mode stok','FEFO')}</div><div class="section"><h2>Master Obat</h2>${simple(med.data,['code','name','strength','unit','selling_price'],['Kode','Obat','Kekuatan','Satuan','Harga Jual'])}</div>`}async function cashier(){const{data}=await sb.from('invoices').select('invoice_no,total,paid_amount,payment_status,visits(patients(full_name))').order('created_at',{ascending:false}).limit(50);content.innerHTML=`<div class="section"><h2>Tagihan Pasien</h2>${simple(data,['invoice_no','total','paid_amount','payment_status'],['Invoice','Total','Terbayar','Status'])}</div>`}async function inpatient(){const[w,b,a]=await Promise.all([sb.from('wards').select('*'),sb.from('beds').select('*'),sb.from('inpatient_admissions').select('id').is('discharged_at',null)]);content.innerHTML=`<div class="grid">${metric('Ruang',w.data?.length||0)}${metric('Tempat tidur',b.data?.length||0)}${metric('Terisi',b.data?.filter(x=>x.status==='occupied').length||0)}${metric('Pasien RI',a.data?.length||0)}</div><div class="section"><h2>Bed Management</h2>${simple(b.data,['bed_no','status','bed_type'],['Bed','Status','Jenis'])}</div>`}async function reports(){const[v,i]=await Promise.all([sb.from('visits').select('id',{count:'exact',head:true}),sb.from('invoices').select('paid_amount')]);const rev=(i.data||[]).reduce((s,x)=>s+Number(x.paid_amount||0),0);content.innerHTML=`<div class="grid">${metric('Total Kunjungan',v.count||0)}${metric('Pendapatan','Rp '+rev.toLocaleString('id-ID'))}${metric('Invoice',i.data?.length||0)}${metric('Sistem','Realtime')}</div>`}async function admin(){const[p,u]=await Promise.all([sb.from('profiles').select('*').order('full_name'),sb.from('service_units').select('*').order('name')]);content.innerHTML=`<div class="section"><h2>Pengguna & Hak Akses</h2>${simple(p.data,['full_name','role','professional_id','is_active'],['Nama','Role','No. Profesi','Aktif'])}</div><div class="section"><h2>Unit Layanan</h2>${simple(u.data,['code','name','unit_type','is_active'],['Kode','Unit','Jenis','Aktif'])}</div>`}async function integrations(){const{data}=await sb.from('integration_configs').select('*').order('provider');content.innerHTML=`<div class="section"><h2>Monitoring Bridging</h2>${simple(data,['provider','environment','is_enabled','last_status'],['Provider','Environment','Aktif','Status'])}<p class="muted">Credential produksi disimpan server-side, bukan di browser.</p></div>`}function simple(d,keys,heads){if(!d?.length)return'<p class="muted">Belum ada data.</p>';return`<table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${d.map(r=>`<tr>${keys.map(k=>`<td>${E(r[k])}</td>`).join('')}</tr>`).join('')}</table>`}function nested(d){if(!d?.length)return'<p class="muted">Belum ada antrean.</p>';return`<table><tr><th>Kunjungan</th><th>No. RM</th><th>Pasien</th><th>Status</th></tr>${d.map(x=>`<tr><td>${E(x.visit_no)}</td><td>${E(x.patients?.medical_record_no)}</td><td>${E(x.patients?.full_name)}</td><td><span class="badge">${E(x.status)}</span></td></tr>`).join('')}</table>`}async function logout(){await sb.auth.signOut()}</script></body></html>
